<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Salties Time Tracker</title>
<style>
  :root {
    --navy: #1a2744;
    --navy-dark: #0f1a2e;
    --ocean: #1e5f8c;
    --gold: #1a6fa8;
    --gold-light: #4aaee8;
    --cream: #f5f0e8;
    --cream-dark: #ede6d6;
    --text-main: #1a2744;
    --text-muted: #5a6a8a;
    --text-light: #8a9ab8;
    --white: #ffffff;
    --red: #c0392b;
    --green: #1e7d4e;
    --border: rgba(26,39,68,0.12);
    --shadow: 0 2px 12px rgba(26,39,68,0.10);
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: var(--cream);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    background: var(--navy-dark);
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-area { display: flex; align-items: center; gap: 10px; }

  .logo-wordmark {
    font-size: 20px;
    font-weight: 700;
    color: var(--cream);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .logo-wordmark span { color: var(--gold-light); }

  .header-sub {
    font-size: 11px;
    color: var(--text-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .btn-new {
    background: var(--gold);
    color: var(--white);
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
  }

  .btn-new:active { opacity: 0.85; transform: scale(0.97); }

  .tabs {
    display: flex;
    background: var(--navy-dark);
    padding: 0 20px;
    border-bottom: 2px solid #4aaee8;
    gap: 4px;
  }

  .tab {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    min-height: 44px;
    display: flex;
    align-items: center;
  }

  .tab.active { color: var(--gold-light); border-bottom-color: var(--gold-light); }

  .content { padding: 16px; max-width: 900px; margin: 0 auto; }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 20px 0 10px;
  }

  .job-card {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .job-card-header {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }

  .job-status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text-light);
  }

  .job-status-dot.active {
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(30,125,78,0.2);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(30,125,78,0.2); }
    50% { box-shadow: 0 0 0 6px rgba(30,125,78,0.08); }
  }

  .job-info { flex: 1; min-width: 0; }

  .job-customer {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .job-desc {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .job-timer-display {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--navy);
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }

  .job-timer-display.running { color: var(--green); }

  .job-card-body { padding: 12px 16px; }

  .job-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 12px;
  }

  .job-meta-item label {
    display: block;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 10px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .job-meta-item span { color: var(--text-main); font-weight: 500; }

  .job-actions { display: flex; gap: 8px; }

  .btn-clock {
    flex: 1;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-clock-in { background: var(--green); color: var(--white); }
  .btn-clock-out { background: var(--red); color: var(--white); }
  .btn-clock:active { opacity: 0.85; transform: scale(0.97); }

  .btn-secondary {
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--cream);
    color: var(--text-main);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-danger {
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(192,57,43,0.2);
    background: rgba(192,57,43,0.06);
    color: var(--red);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .session-log {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  .session-log-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-light);
    margin-bottom: 8px;
  }

  .session-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
  }

  .session-row:last-child { border-bottom: none; }
  .session-row .duration { font-weight: 600; color: var(--text-main); }

  .total-bar {
    background: var(--navy);
    color: var(--cream);
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  }

  .total-bar .total-time { font-size: 18px; color: var(--gold-light); }

  .completed-badge {
    background: rgba(30,125,78,0.1);
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,20,40,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: var(--radius);
    width: 100%;
    max-width: 500px;
    overflow: hidden;
  }

  .modal-header {
    background: var(--navy-dark);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-title { color: var(--cream); font-size: 17px; font-weight: 700; }

  .btn-close {
    color: var(--text-light);
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    min-width: 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-body { padding: 20px; }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-family: inherit;
    color: var(--text-main);
    background: var(--cream);
    -webkit-appearance: none;
    min-height: 48px;
  }

  .form-group textarea {
    resize: vertical;
    min-height: 80px;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--ocean);
    background: var(--white);
  }

  .modal-footer {
    padding: 0 20px 20px;
    display: flex;
    gap: 10px;
  }

  .btn-primary {
    flex: 1;
    padding: 14px;
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
  }

  .btn-cancel {
    padding: 14px 20px;
    background: var(--cream);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    min-height: 48px;
  }

  /* History tab */
  .history-card {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .history-header {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .history-customer { font-size: 16px; font-weight: 700; color: var(--navy); }
  .history-desc { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .history-dates { font-size: 12px; color: var(--text-light); text-align: right; }

  .history-total {
    background: var(--navy);
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--cream);
  }

  .history-total .time { font-size: 18px; font-weight: 700; color: var(--gold-light); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 15px; }

  /* Summary tab */
  .summary-stat {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }

  .summary-stat .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-light);
    font-weight: 700;
    margin-bottom: 4px;
  }

  .summary-stat .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--navy);
  }

  .export-row {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .btn-export {
    flex: 1;
    padding: 14px;
    background: var(--ocean);
    color: var(--white);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
  }

  .btn-import {
    flex: 1;
    padding: 14px;
    background: var(--cream);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    min-height: 48px;
  }

  .hidden { display: none !important; }

  .danger-zone {
    border: 1px solid rgba(192,57,43,0.2);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 24px;
    background: rgba(192,57,43,0.03);
  }

  .danger-zone-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--red);
    margin-bottom: 10px;
  }

  .rate-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }

  .rate-label { flex: 1; }
  .rate-label .r-title { font-size: 15px; font-weight: 600; color: var(--navy); }
  .rate-label .r-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .rate-field {
    width: 100px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-family: inherit;
    color: var(--navy);
    background: var(--cream);
    text-align: right;
    font-weight: 700;
    -webkit-appearance: none;
  }
</style>
</head>

  <div id="tab-completed" class="hidden">
    <div class="section-title">Completed jobs</div>
    <div id="completed-jobs-list"></div>
  </div>

  <!-- ALL JOBS TAB -->
  <div id="tab-history" class="hidden">
    <div class="section-title">All jobs</div>
    <div id="history-list"></div>
  </div>

  <!-- SUMMARY TAB -->
  <div id="tab-summary" class="hidden">
    <div class="section-title">Overview</div>
    <div id="summary-stats"></div>

    <div class="section-title">Hourly rate</div>
    <div class="rate-input-row">
      <div class="rate-label">
        <div class="r-title">Labour rate (£/hr)</div>
        <div class="r-sub">Used for cost estimates</div>
      </div>
      <input type="number" class="rate-field" id="hourly-rate" placeholder="0" min="0" step="0.50" onchange="saveRate()">
    </div>

    <div class="export-row">
      <button class="btn-export" onclick="exportData()">⬇ Export backup</button>
      <button class="btn-import" onclick="document.getElementById('import-file').click()">⬆ Import backup</button>
    </div>
    <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">

    <div class="danger-zone">
      <div class="danger-zone-title">⚠ Danger zone</div>
      <button class="btn-danger" style="width:100%" onclick="clearAllData()">Clear all data</button>
    </div>
  </div>
</div>

<!-- NEW JOB MODAL -->
<div class="modal-overlay" id="new-job-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">New Job</div>
      <button class="btn-close" onclick="closeNewJobModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Customer Name *</label>
        <input type="text" id="nj-customer" placeholder="e.g. Smith Family" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Job / Project Description *</label>
        <textarea id="nj-desc" placeholder="e.g. Oak dining table with live edge, 2.2m × 0.9m"></textarea>
      </div>
      <div class="form-group">
        <label>Job Reference (optional)</label>
        <input type="text" id="nj-ref" placeholder="e.g. SC-2026-042" autocomplete="off">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeNewJobModal()">Cancel</button>
      <button class="btn-primary" onclick="createJob()">Create Job</button>
    </div>
  </div>
</div>

<!-- JOB DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="detail-modal-title">Job Detail</div>
      <button class="btn-close" onclick="closeDetailModal()">✕</button>
    </div>
    <div class="modal-body" id="detail-modal-body"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeDetailModal()">Close</button>
    </div>
  </div>
</div>

<script>
  let jobs = [];
  let timerInterval = null;
  let currentTab = 'active';

  function loadData() {
    const saved = localStorage.getItem('salties_time_tracker_v1');
    if (saved) {
      try {
        jobs = JSON.parse(saved);
      } catch(e) { jobs = []; }
    }
    const rate = localStorage.getItem('salties_hourly_rate');
    if (rate) document.getElementById('hourly-rate').value = rate;
  }

  function saveData() {
    localStorage.setItem('salties_time_tracker_v1', JSON.stringify(jobs));
  }

  function saveRate() {
    localStorage.setItem('salties_hourly_rate', document.getElementById('hourly-rate').value);
    renderSummary();
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
  }

  function createJob() {
    const customer = document.getElementById('nj-customer').value.trim();
    const desc = document.getElementById('nj-desc').value.trim();
    const ref = document.getElementById('nj-ref').value.trim();

    if (!customer || !desc) {
      alert('Please enter customer name and job description.');
      return;
    }

    const job = {
      id: uid(),
      customer,
      desc,
      ref,
      startDate: new Date().toISOString(),
      endDate: null,
      status: 'active',
      sessions: [],
      activeSessionStart: null
    };

    jobs.unshift(job);
    saveData();
    closeNewJobModal();
    showTab('active', document.querySelector('.tab'));
    renderAll();
  }

  function clockIn(jobId) {
    const job = jobs.find(j => j.id === jobId);
    if (!job || job.activeSessionStart) return;
    job.activeSessionStart = Date.now();
    job.status = 'active';
    saveData();
    renderAll();
  }

  function clockOut(jobId) {
    const job = jobs.find(j => j.id === jobId);
    if (!job || !job.activeSessionStart) return;
    const duration = Date.now() - job.activeSessionStart;
    job.sessions.push({
      start: job.activeSessionStart,
      end: Date.now(),
      duration
    });
    job.activeSessionStart = null;
    saveData();
    renderAll();
  }

  function completeJob(jobId) {
    const job = jobs.find(j => j.id === jobId);
    if (!job) return;
    if (job.activeSessionStart) clockOut(jobId);
    if (confirm('Mark "' + job.customer + '" as completed?')) {
      job.status = 'completed';
      job.endDate = new Date().toISOString();
      saveData();
      renderAll();
    }
  }

  function reopenJob(jobId) {
    const job = jobs.find(j => j.id === jobId);
    if (!job) return;
    job.status = 'active';
    job.endDate = null;
    saveData();
    renderAll();
  }

  function deleteJob(jobId) {
    const job = jobs.find(j => j.id === jobId);
    if (!job) return;
    if (confirm('Delete "' + job.customer + '"? This cannot be undone.')) {
      jobs = jobs.filter(j => j.id !== jobId);
      saveData();
      renderAll();
    }
  }

  function getTotalMs(job) {
    let total = job.sessions.reduce((sum, s) => sum + s.duration, 0);
    if (job.activeSessionStart) total += Date.now() - job.activeSessionStart;
    return total;
  }

  function formatDuration(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const hStr = h > 0 ? h + 'h ' : '';
    const mStr = m.toString().padStart(h > 0 ? 2 : 1, '0') + 'm ';
    const sStr = s.toString().padStart(2, '0') + 's';
    return hStr + mStr + sStr;
  }

  function formatDurationShort(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    return h + 'h ' + m.toString().padStart(2, '0') + 'm';
  }

  function formatDate(isoStr) {
    if (!isoStr) return '—';
    const d = new Date(isoStr);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function formatTime(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  function renderJobCard(job) {
    const isRunning = !!job.activeSessionStart;
    const totalMs = getTotalMs(job);
    const isCompleted = job.status === 'completed';

    const sessionRows = job.sessions.slice(-5).map(s => {
      return `<div class="session-row">
        <span>${new Date(s.start).toLocaleDateString('en-GB', {day:'numeric',month:'short'})} ${formatTime(s.start)} → ${formatTime(s.end)}</span>
        <span class="duration">${formatDurationShort(s.duration)}</span>
      </div>`;
    }).join('');

    const refHtml = job.ref ? `<div class="job-meta-item"><label>Reference</label><span>${job.ref}</span></div>` : '';

    const actionButtons = isCompleted
      ? `<button class="btn-secondary" onclick="reopenJob('${job.id}')">↩ Reopen</button>
         <button class="btn-secondary" onclick="showDetail('${job.id}')">📋 Detail</button>
         <button class="btn-danger" onclick="deleteJob('${job.id}')">✕</button>`
      : isRunning
        ? `<button class="btn-clock btn-clock-out" onclick="clockOut('${job.id}')">⏹ Clock Out</button>
           <button class="btn-secondary" onclick="showDetail('${job.id}')">📋</button>`
        : `<button class="btn-clock btn-clock-in" onclick="clockIn('${job.id}')">▶ Clock In</button>
           <button class="btn-secondary" onclick="completeJob('${job.id}')">✓ Done</button>
           <button class="btn-danger" onclick="deleteJob('${job.id}')">✕</button>`;

    const rate = parseFloat(localStorage.getItem('salties_hourly_rate') || '0');
    const costHtml = rate > 0
      ? `<div class="job-meta-item"><label>Est. Cost</label><span>£${(totalMs / 3600000 * rate).toFixed(2)}</span></div>`
      : '';

    return `<div class="job-card" id="card-${job.id}">
      <div class="job-card-header">
        <div class="job-status-dot ${isRunning ? 'active' : ''}"></div>
        <div class="job-info">
          <div class="job-customer">${job.customer}</div>
          <div class="job-desc">${job.desc}</div>
        </div>
        <div class="job-timer-display ${isRunning ? 'running' : ''}" id="timer-${job.id}">${formatDuration(totalMs)}</div>
      </div>
      <div class="job-card-body">
        <div class="job-meta">
          <div class="job-meta-item"><label>Started</label><span>${formatDate(job.startDate)}</span></div>
          <div class="job-meta-item"><label>Last clock-in</label><span>${isRunning ? formatTime(job.activeSessionStart) + ' (live)' : (job.sessions.length > 0 ? formatTime(job.sessions[job.sessions.length-1].start) : '—')}</span></div>
          ${refHtml}
          ${costHtml}
          ${isCompleted ? `<div class="job-meta-item"><label>Completed</label><span>${formatDate(job.endDate)}</span></div>` : ''}
        </div>
        <div class="job-actions">${actionButtons}</div>
        ${job.sessions.length > 0 ? `<div class="session-log"><div class="session-log-title">Recent sessions (${job.sessions.length} total)</div>${sessionRows}</div>` : ''}
      </div>
      <div class="total-bar">
        <span>Total time logged</span>
        <span class="total-time" id="total-${job.id}">${formatDurationShort(totalMs)}</span>
      </div>
    </div>`;
  }

  function renderAll() {
    const activeJobs = jobs.filter(j => j.status !== 'completed');
    const completedJobs = jobs.filter(j => j.status === 'completed');

    const activeList = document.getElementById('active-jobs-list');
    if (activeJobs.length === 0) {
      activeList.innerHTML = `<div class="empty-state"><div class="icon">⏱</div><p>No active jobs. Tap <strong>+ New Job</strong> to get started.</p></div>`;
    } else {
      activeList.innerHTML = activeJobs.map(renderJobCard).join('');
    }

    const completedList = document.getElementById('completed-jobs-list');
    if (completedJobs.length === 0) {
      completedList.innerHTML = `<div class="empty-state"><div class="icon">✓</div><p>No completed jobs yet.</p></div>`;
    } else {
      completedList.innerHTML = completedJobs.map(renderJobCard).join('');
    }

    const historyList = document.getElementById('history-list');
    if (jobs.length === 0) {
      historyList.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>No jobs recorded yet.</p></div>`;
    } else {
      historyList.innerHTML = jobs.map(j => {
        const totalMs = getTotalMs(j);
        const rate = parseFloat(localStorage.getItem('salties_hourly_rate') || '0');
        const costHtml = rate > 0 ? `<span>£${(totalMs / 3600000 * rate).toFixed(2)}</span>` : '';
        const statusBadge = j.status === 'completed'
          ? `<span class="completed-badge">Completed</span>`
          : j.activeSessionStart
            ? `<span style="font-size:11px;color:var(--green);font-weight:700">● LIVE</span>`
            : `<span style="font-size:11px;color:var(--text-light);font-weight:600">Paused</span>`;
        return `<div class="history-card">
          <div class="history-header">
            <div>
              <div class="history-customer">${j.customer}</div>
              <div class="history-desc">${j.desc}</div>
              ${j.ref ? `<div style="font-size:11px;color:var(--text-light);margin-top:3px">Ref: ${j.ref}</div>` : ''}
            </div>
            <div>
              ${statusBadge}
              <div class="history-dates" style="margin-top:6px">${formatDate(j.startDate)}<br>${j.endDate ? '→ ' + formatDate(j.endDate) : ''}</div>
            </div>
          </div>
          <div class="history-total">
            <span>${j.sessions.length} session${j.sessions.length !== 1 ? 's' : ''}</span>
            <div style="display:flex;align-items:center;gap:14px">${costHtml}<span class="time">${formatDurationShort(totalMs)}</span></div>
          </div>
        </div>`;
      }).join('');
    }

    renderSummary();
    startTimers();
  }

  function renderSummary() {
    const totalMs = jobs.reduce((sum, j) => sum + getTotalMs(j), 0);
    const activeCount = jobs.filter(j => j.status !== 'completed').length;
    const completedCount = jobs.filter(j => j.status === 'completed').length;
    const liveCount = jobs.filter(j => j.activeSessionStart).length;
    const rate = parseFloat(localStorage.getItem('salties_hourly_rate') || '0');
    const totalHours = totalMs / 3600000;
    const totalCost = rate > 0 ? `£${(totalHours * rate).toFixed(2)}` : '—';

    document.getElementById('summary-stats').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div class="summary-stat">
          <div class="stat-label">Total time logged</div>
          <div class="stat-value">${formatDurationShort(totalMs)}</div>
        </div>
        <div class="summary-stat">
          <div class="stat-label">Total jobs</div>
          <div class="stat-value">${jobs.length}</div>
        </div>
        <div class="summary-stat">
          <div class="stat-label">Active jobs</div>
          <div class="stat-value">${activeCount}</div>
        </div>
        <div class="summary-stat">
          <div class="stat-label">Running now</div>
          <div class="stat-value" style="color:${liveCount > 0 ? 'var(--green)' : 'var(--navy)'}">${liveCount}</div>
        </div>
      </div>
      <div class="summary-stat">
        <div class="stat-label">Total labour cost (at your rate)</div>
        <div class="stat-value">${totalCost}</div>
      </div>
    `;
  }

  function startTimers() {
    if (timerInterval) clearInterval(timerInterval);
    const hasRunning = jobs.some(j => j.activeSessionStart);
    if (!hasRunning) return;

    timerInterval = setInterval(() => {
      jobs.forEach(j => {
        if (!j.activeSessionStart) return;
        const el = document.getElementById('timer-' + j.id);
        const totalEl = document.getElementById('total-' + j.id);
        const ms = getTotalMs(j);
        if (el) el.textContent = formatDuration(ms);
        if (totalEl) totalEl.textContent = formatDurationShort(ms);
      });
    }, 1000);
  }

  function showTab(tabName, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    document.getElementById('tab-active').classList.add('hidden');
    document.getElementById('tab-completed').classList.add('hidden');
    document.getElementById('tab-history').classList.add('hidden');
    document.getElementById('tab-summary').classList.add('hidden');
    document.getElementById('tab-' + tabName).classList.remove('hidden');
    currentTab = tabName;
  }

  function openNewJobModal() {
    document.getElementById('nj-customer').value = '';
    document.getElementById('nj-desc').value = '';
    document.getElementById('nj-ref').value = '';
    document.getElementById('new-job-modal').classList.add('open');
    setTimeout(() => document.getElementById('nj-customer').focus(), 100);
  }

  function closeNewJobModal() {
    document.getElementById('new-job-modal').classList.remove('open');
  }

  function showDetail(jobId) {
    const job = jobs.find(j => j.id === jobId);
    if (!job) return;
    const rate = parseFloat(localStorage.getItem('salties_hourly_rate') || '0');
    const totalMs = getTotalMs(job);
    const sessionRows = job.sessions.map((s, i) => {
      return `<tr>
        <td style="padding:6px 0;font-size:13px;color:var(--text-muted)">${i + 1}</td>
        <td style="padding:6px 0;font-size:13px">${new Date(s.start).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} ${formatTime(s.start)}</td>
        <td style="padding:6px 0;font-size:13px">${formatTime(s.end)}</td>
        <td style="padding:6px 0;font-size:13px;font-weight:600;text-align:right">${formatDurationShort(s.duration)}</td>
      </tr>`;
    }).join('');

    document.getElementById('detail-modal-title').textContent = job.customer;
    document.getElementById('detail-modal-body').innerHTML = `
      <p style="font-size:14px;color:var(--text-muted);margin-bottom:16px">${job.desc}</p>
      ${job.ref ? `<p style="font-size:12px;color:var(--text-light);margin-bottom:16px">Ref: ${job.ref}</p>` : ''}
      <table style="width:100%;border-collapse:collapse;margin-bottom:16px">
        <thead>
          <tr style="border-bottom:1px solid var(--border)">
            <th style="text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);padding-bottom:6px">#</th>
            <th style="text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);padding-bottom:6px">Clock in</th>
            <th style="text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);padding-bottom:6px">Clock out</th>
            <th style="text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);padding-bottom:6px">Duration</th>
          </tr>
        </thead>
        <tbody>${sessionRows}</tbody>
      </table>
      <div style="background:var(--navy);border-radius:var(--radius-sm);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="color:var(--cream);font-size:13px;font-weight:600">Total time</span>
        <span style="color:var(--gold-light);font-size:20px;font-weight:700">${formatDurationShort(totalMs)}</span>
      </div>
      ${rate > 0 ? `<div style="background:var(--cream);border-radius:var(--radius-sm);padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
        <span style="color:var(--text-muted);font-size:13px">Labour cost @ £${rate}/hr</span>
        <span style="color:var(--navy);font-size:17px;font-weight:700">£${(totalMs / 3600000 * rate).toFixed(2)}</span>
      </div>` : ''}
    `;
    document.getElementById('detail-modal').classList.add('open');
  }

  function closeDetailModal() {
    document.getElementById('detail-modal').classList.remove('open');
  }

  function exportData() {
    const data = {
      exported: new Date().toISOString(),
      version: 1,
      jobs,
      hourlyRate: localStorage.getItem('salties_hourly_rate') || ''
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'salties-time-tracker-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.jobs) throw new Error('Invalid file');
        if (!confirm('This will replace all current data. Continue?')) return;
        jobs = data.jobs;
        if (data.hourlyRate) {
          localStorage.setItem('salties_hourly_rate', data.hourlyRate);
          document.getElementById('hourly-rate').value = data.hourlyRate;
        }
        saveData();
        renderAll();
        alert('Import successful. ' + jobs.length + ' jobs loaded.');
      } catch(err) {
        alert('Invalid backup file.');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function clearAllData() {
    if (!confirm('Delete ALL jobs and time records? This cannot be undone.')) return;
    if (!confirm('Are you absolutely sure? All data will be lost.')) return;
    jobs = [];
    saveData();
    renderAll();
  }

  loadData();
  renderAll();
</script>
</body>
</html>
